<style>
:root {
  --paper: #f6f3ec;
  --paper-light: #fcfaf6;
  --surface: rgba(255,255,255,0.86);
  --surface-strong: #ffffff;
  --line: rgba(17,17,17,0.12);
  --ink: #111111;
  --ink-soft: #4d4d4d;
  --ink-mute: #6a6a6a;
  --green: #0f5d44;
  --green-deep: #0a3f30;
  --green-soft: rgba(15,93,68,0.10);
  --green-line: rgba(15,93,68,0.25);
  --gold: #bf8b2c;
  --gold-soft: rgba(191,139,44,0.14);
  --blue: #163e7a;
  --red: #c0392b;
  --font-serif: 'Libre Baskerville', Georgia, serif;
  --font-sans: 'Manrope', 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --shadow: 0 24px 60px rgba(17,17,17,0.10);
  --shadow-sm: 0 2px 8px rgba(17,17,17,0.06);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --content-width: 1200px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font-sans);
  font-size:16px;line-height:1.7;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 80% -5%, rgba(191,139,44,.08), transparent 60%),
    radial-gradient(1000px 500px at 0% 10%, rgba(15,93,68,.07), transparent 55%),
    linear-gradient(180deg, #fcfaf6 0%, var(--paper) 42%, #ffffff 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--font-serif);color:var(--ink);margin:1.5em 0 .5em}
h1{font-size:2rem;border-bottom:2px solid var(--green);padding-bottom:12px}
h2{font-size:1.5rem;border-bottom:1px solid var(--line);padding-bottom:8px}
h3{font-size:1.25rem;border-left:3px solid var(--green);padding-left:12px}
p{line-height:1.8;margin:.8em 0}
code,pre{font-family:var(--font-mono);font-size:.88em}
code{background:var(--green-soft);padding:2px 6px;border-radius:4px}
pre{background:var(--surface-strong);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;overflow-x:auto}
blockquote{border-left:3px solid var(--green);background:var(--green-soft);padding:12px 16px;margin:1em 0;font-style:italic}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.9rem}
th{background:var(--green-soft);color:var(--green-deep);font-weight:600;padding:10px 14px;border:1px solid var(--line)}
td{padding:10px 14px;border:1px solid var(--line)}
tr:nth-child(even){background:rgba(15,93,68,.03)}
tr:hover{background:var(--green-soft)}
hr{border:none;border-top:1px solid var(--line);margin:2em 0}
img{max-width:100%;border-radius:var(--radius-sm)}

</style>
