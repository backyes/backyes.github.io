<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Arial,sans-serif">
  <!-- Background -->
  <rect width="600" height="320" fill="#1a1d23" rx="8"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" fill="#4a8fe0" font-size="14" font-weight="600">2.5D Packaging: GPU + HBM on Silicon Interposer</text>

  <!-- Package Substrate -->
  <rect x="60" y="220" width="480" height="70" rx="4" fill="#2a2d35" stroke="#3a3d45" stroke-width="1"/>
  <text x="300" y="260" text-anchor="middle" fill="#7d848d" font-size="11">Organic Package Substrate</text>

  <!-- Silicon Interposer -->
  <rect x="80" y="140" width="440" height="70" rx="4" fill="#1e2a3a" stroke="#4a8fe0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="300" y="165" text-anchor="middle" fill="#4a8fe0" font-size="10">Silicon Interposer (CoWoS)</text>
  <text x="300" y="180" text-anchor="middle" fill="#7d848d" font-size="9">Sub-micron routing (~0.4μm line/space)</text>

  <!-- GPU Die -->
  <rect x="100" y="60" width="160" height="70" rx="4" fill="#2d4a3e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="180" y="90" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">GPU Die</text>
  <text x="180" y="108" text-anchor="middle" fill="#a0a5ad" font-size="9">~1,000 mm²</text>
  <text x="180" y="120" text-anchor="middle" fill="#a0a5ad" font-size="8">Compute logic</text>

  <!-- HBM Stacks -->
  <rect x="290" y="50" width="50" height="80" rx="3" fill="#4a2d3e" stroke="#d29922" stroke-width="1"/>
  <rect x="346" y="50" width="50" height="80" rx="3" fill="#4a2d3e" stroke="#d29922" stroke-width="1"/>
  <rect x="402" y="50" width="50" height="80" rx="3" fill="#4a2d3e" stroke="#d29922" stroke-width="1"/>
  <rect x="458" y="50" width="50" height="80" rx="3" fill="#4a2d3e" stroke="#d29922" stroke-width="1"/>
  <text x="395" y="85" text-anchor="middle" fill="#d29922" font-size="10" font-weight="600">HBM3E</text>
  <text x="395" y="100" text-anchor="middle" fill="#a0a5ad" font-size="8">4-12 DRAM layers</text>
  <text x="395" y="112" text-anchor="middle" fill="#a0a5ad" font-size="8">TSV + Micro-Bump</text>

  <!-- Arrows / Labels -->
  <line x1="180" y1="130" x2="180" y2="140" stroke="#3fb950" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="395" y1="130" x2="395" y2="140" stroke="#d29922" stroke-width="1"/>

  <!-- Legend -->
  <rect x="60" y="295" width="8" height="8" fill="#2d4a3e" stroke="#3fb950" stroke-width="1"/>
  <text x="72" y="303" fill="#a0a5ad" font-size="8">Compute</text>
  <rect x="130" y="295" width="8" height="8" fill="#4a2d3e" stroke="#d29922" stroke-width="1"/>
  <text x="142" y="303" fill="#a0a5ad" font-size="8">Memory</text>
  <rect x="200" y="295" width="8" height="8" fill="#1e2a3a" stroke="#4a8fe0" stroke-width="1"/>
  <text x="212" y="303" fill="#a0a5ad" font-size="8">Interposer</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#3fb950" stroke-width="1"/>
    </marker>
  </defs>
</svg>