<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" font-family="Arial,sans-serif">
  <!-- Background -->
  <rect width="500" height="480" fill="#1a1d23" rx="8"/>

  <!-- Title -->
  <text x="250" y="28" text-anchor="middle" fill="#4a8fe0" font-size="13" font-weight="600">AI Memory Hierarchy: From Package to Datacenter</text>
  <text x="250" y="45" text-anchor="middle" fill="#7d848d" font-size="10">Advanced packaging solves "last millimeter"; memory fabric solves "last meter"</text>

  <!-- Layer 1: Remote Memory Fabric (Top - widest) -->
  <rect x="40" y="65" width="420" height="65" rx="6" fill="#1e2a3a" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="250" y="88" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="600">Remote Memory Fabric — Datacenter Scale</text>
  <text x="250" y="105" text-anchor="middle" fill="#a0a5ad" font-size="9">CXL 3.0 · UALink · NVLink-C2C · RDMA/Ethernet</text>
  <text x="250" y="120" text-anchor="middle" fill="#7d848d" font-size="8">PB-scale disaggregated memory · TB/s class bandwidth</text>

  <!-- Arrow down -->
  <line x1="250" y1="130" x2="250" y2="148" stroke="#4a8fe0" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- Layer 2: NVMe/Storage -->
  <rect x="60" y="150" width="380" height="55" rx="6" fill="#2a2d35" stroke="#3498db" stroke-width="1.5"/>
  <text x="250" y="173" text-anchor="middle" fill="#3498db" font-size="11" font-weight="600">NVMe / Storage — Rack Scale</text>
  <text x="250" y="190" text-anchor="middle" fill="#a0a5ad" font-size="9">PB capacity · high latency · cold/warm data</text>

  <!-- Arrow down -->
  <line x1="250" y1="205" x2="250" y2="223" stroke="#4a8fe0" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- Layer 3: DDR/CXL Memory -->
  <rect x="80" y="225" width="340" height="55" rx="6" fill="#2a2d35" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="250" y="248" text-anchor="middle" fill="#1abc9c" font-size="11" font-weight="600">DDR / CXL Memory — Node Scale</text>
  <text x="250" y="265" text-anchor="middle" fill="#a0a5ad" font-size="9">TB capacity · shared across nodes · CXL memory pooling</text>

  <!-- Arrow down -->
  <line x1="250" y1="280" x2="250" y2="298" stroke="#4a8fe0" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- Layer 4: HBM (package-internal) -->
  <rect x="100" y="300" width="300" height="55" rx="6" fill="#4a2d3e" stroke="#d29922" stroke-width="1.5"/>
  <text x="250" y="323" text-anchor="middle" fill="#d29922" font-size="11" font-weight="600">HBM (Package-Internal)</text>
  <text x="250" y="340" text-anchor="middle" fill="#a0a5ad" font-size="9">TB/s bandwidth · ~100GB capacity · CoWoS packaging</text>

  <!-- Arrow down -->
  <line x1="250" y1="355" x2="250" y2="373" stroke="#4a8fe0" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- Layer 5: Compute Die (Bottom - narrowest) -->
  <rect x="120" y="375" width="260" height="50" rx="6" fill="#2d4a3e" stroke="#3fb950" stroke-width="2"/>
  <text x="250" y="397" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">Compute Die (GPU/TPU)</text>
  <text x="250" y="413" text-anchor="middle" fill="#a0a5ad" font-size="9">~1,000 mm² · TSMC N3/N4 · high heat density</text>

  <!-- Right side annotation -->
  <rect x="420" y="65" width="70" height="65" rx="4" fill="none" stroke="#9b59b6" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="455" y="95" text-anchor="middle" fill="#9b59b6" font-size="7">Last meter</text>
  <text x="455" y="108" text-anchor="middle" fill="#9b59b6" font-size="7">problem</text>

  <rect x="420" y="300" width="70" height="55" rx="4" fill="none" stroke="#d29922" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="455" y="323" text-anchor="middle" fill="#d29922" font-size="7">Last mm</text>
  <text x="455" y="336" text-anchor="middle" fill="#d29922" font-size="7">problem</text>

  <!-- Watermark -->
  <text x="495" y="472" text-anchor="end" fill="#8b949e" font-size="7" font-style="italic" opacity="0.6">backyes.github.io</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#4a8fe0" stroke-width="1"/>
    </marker>
  </defs>
</svg>