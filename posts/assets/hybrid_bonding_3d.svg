<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="Arial,sans-serif">
  <!-- Background -->
  <rect width="400" height="440" fill="#1a1d23" rx="8"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" fill="#4a8fe0" font-size="13" font-weight="600">3D Integration: Compute | Cache | Memory</text>
  <text x="200" y="45" text-anchor="middle" fill="#7d848d" font-size="10">Hybrid Bonding — copper-to-copper direct bond at micron-scale pitch</text>

  <!-- 3D Stacked Layers (isometric-style side view) -->

  <!-- Memory Layer (HBM) - Top -->
  <rect x="80" y="70" width="240" height="55" rx="6" fill="#4a2d3e" stroke="#d29922" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" fill="#d29922" font-size="11" font-weight="600">Memory (HBM)</text>
  <text x="200" y="112" text-anchor="middle" fill="#a0a5ad" font-size="9">8-12 DRAM layers, TSV stacked</text>

  <!-- Hybrid Bonding Layer 1 -->
  <rect x="80" y="125" width="240" height="12" rx="2" fill="#2a4a5e" stroke="#4a8fe0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="200" y="134" text-anchor="middle" fill="#4a8fe0" font-size="7">Hybrid Bonding (~10-50 μm pitch)</text>

  <!-- Cache Layer (SRAM) - Middle -->
  <rect x="80" y="137" width="240" height="55" rx="6" fill="#2d3a4e" stroke="#7d848d" stroke-width="1.5"/>
  <text x="200" y="162" text-anchor="middle" fill="#a0a5ad" font-size="11" font-weight="600">Cache (SRAM)</text>
  <text x="200" y="178" text-anchor="middle" fill="#7d848d" font-size="9">Fast scratchpad, low latency</text>

  <!-- Hybrid Bonding Layer 2 -->
  <rect x="80" y="192" width="240" height="12" rx="2" fill="#2a4a5e" stroke="#4a8fe0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="200" y="201" text-anchor="middle" fill="#4a8fe0" font-size="7">Hybrid Bonding (~10-50 μm pitch)</text>

  <!-- Compute Layer (Logic) - Bottom -->
  <rect x="80" y="204" width="240" height="70" rx="6" fill="#2d4a3e" stroke="#3fb950" stroke-width="2"/>
  <text x="200" y="230" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">Compute Logic (GPU/TPU)</text>
  <text x="200" y="248" text-anchor="middle" fill="#a0a5ad" font-size="9">~1,000 mm², TSMC N3/N4</text>
  <text x="200" y="263" text-anchor="middle" fill="#a0a5ad" font-size="8">High heat density (~100W/cm²)</text>

  <!-- Substrate -->
  <rect x="60" y="274" width="280" height="40" rx="4" fill="#2a2d35" stroke="#3a3d45" stroke-width="1"/>
  <text x="200" y="298" text-anchor="middle" fill="#7d848d" font-size="9">Organic Package Substrate</text>

  <!-- Comparison arrows on right side -->
  <rect x="340" y="70" width="50" height="55" rx="3" fill="none" stroke="#d29922" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="365" y="98" text-anchor="middle" fill="#d29922" font-size="6">vs. 2.5D</text>

  <rect x="340" y="137" width="50" height="55" rx="3" fill="none" stroke="#7d848d" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="365" y="165" text-anchor="middle" fill="#a0a5ad" font-size="6">shorter</text>

  <rect x="340" y="204" width="50" height="70" rx="3" fill="none" stroke="#3fb950" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="365" y="238" text-anchor="middle" fill="#3fb950" font-size="6">vertical</text>

  <!-- Benefits box -->
  <rect x="40" y="330" width="320" height="90" rx="6" fill="#1e2a3a" stroke="#4a8fe0" stroke-width="1"/>
  <text x="60" y="352" fill="#4a8fe0" font-size="10" font-weight="600">Hybrid Bonding Advantages vs. Micro-Bump:</text>

  <text x="60" y="372" fill="#a0a5ad" font-size="9">✓ 10-100× higher interconnect density</text>
  <text x="60" y="388" fill="#a0a5ad" font-size="9">✓ Shorter vertical distance (~10-50 μm vs. ~100+ μm)</text>
  <text x="60" y="404" fill="#a0a5ad" font-size="9">✓ Lower power per bit transferred</text>
  <text x="60" y="420" fill="#a0a5ad" font-size="9">✓ Eliminates solder bumps entirely</text>

  <!-- Watermark -->
  <text x="395" y="432" text-anchor="end" fill="#8b949e" font-size="7" font-style="italic" opacity="0.6">backyes.github.io</text>
</svg>