<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial,sans-serif">
  <!-- Background -->
  <rect width="640" height="380" fill="#1a1d23" rx="8"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" fill="#4a8fe0" font-size="14" font-weight="600">CoWoS-S vs CoWoS-L: Packaging Evolution</text>

  <!-- ===== LEFT: CoWoS-S ===== -->
  <text x="160" y="55" text-anchor="middle" fill="#a0a5ad" font-size="12" font-weight="600">CoWoS-S (H100, A100)</text>

  <!-- Substrate -->
  <rect x="40" y="280" width="240" height="50" rx="4" fill="#2a2d35" stroke="#3a3d45" stroke-width="1"/>
  <text x="160" y="310" text-anchor="middle" fill="#7d848d" font-size="9">Organic Substrate</text>

  <!-- Full Silicon Interposer -->
  <rect x="50" y="200" width="220" height="70" rx="4" fill="#1e2a3a" stroke="#4a8fe0" stroke-width="1.5"/>
  <text x="160" y="225" text-anchor="middle" fill="#4a8fe0" font-size="10" font-weight="600">Full Silicon Interposer</text>
  <text x="160" y="242" text-anchor="middle" fill="#7d848d" font-size="8">~1,700-2,000 mm² (2.5× reticle)</text>
  <text x="160" y="256" text-anchor="middle" fill="#7d848d" font-size="8">Sub-micron routing throughout</text>

  <!-- GPU Die -->
  <rect x="60" y="120" width="100" height="70" rx="4" fill="#2d4a3e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="110" y="150" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">GPU Die</text>
  <text x="110" y="168" text-anchor="middle" fill="#a0a5ad" font-size="8">814 mm²</text>

  <!-- HBM -->
  <rect x="180" y="120" width="70" height="70" rx="4" fill="#4a2d3e" stroke="#d29922" stroke-width="1.5"/>
  <text x="215" y="150" text-anchor="middle" fill="#d29922" font-size="9" font-weight="600">HBM</text>
  <text x="215" y="168" text-anchor="middle" fill="#a0a5ad" font-size="8">6 stacks</text>

  <!-- Limitation label -->
  <rect x="40" y="340" width="240" height="25" rx="3" fill="#3d1f1f" stroke="#ff6b6b" stroke-width="1"/>
  <text x="160" y="357" text-anchor="middle" fill="#ff6b6b" font-size="8">⚠ Large Si area → warpage, yield loss</text>

  <!-- ===== RIGHT: CoWoS-L ===== -->
  <text x="480" y="55" text-anchor="middle" fill="#a0a5ad" font-size="12" font-weight="600">CoWoS-L (B200, GB200)</text>

  <!-- Substrate -->
  <rect x="360" y="280" width="240" height="50" rx="4" fill="#2a2d35" stroke="#3a3d45" stroke-width="1"/>
  <text x="480" y="310" text-anchor="middle" fill="#7d848d" font-size="9">Organic Substrate (larger)</text>

  <!-- Organic RDL base -->
  <rect x="370" y="200" width="220" height="70" rx="4" fill="#2a2d35" stroke="#3a3d45" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="480" y="222" text-anchor="middle" fill="#7d848d" font-size="9">Organic RDL (low-cost, large area)</text>

  <!-- Local Silicon Bridges -->
  <rect x="380" y="235" width="60" height="28" rx="3" fill="#1e2a3a" stroke="#4a8fe0" stroke-width="1.5"/>
  <text x="410" y="253" text-anchor="middle" fill="#4a8fe0" font-size="7">Si Bridge</text>
  <rect x="460" y="235" width="60" height="28" rx="3" fill="#1e2a3a" stroke="#4a8fe0" stroke-width="1.5"/>
  <text x="490" y="253" text-anchor="middle" fill="#4a8fe0" font-size="7">Si Bridge</text>
  <rect x="530" y="235" width="50" height="28" rx="3" fill="#1e2a3a" stroke="#4a8fe0" stroke-width="1.5"/>
  <text x="555" y="253" text-anchor="middle" fill="#4a8fe0" font-size="7">Si Bridge</text>

  <!-- GPU Dies (2) -->
  <rect x="370" y="120" width="90" height="70" rx="4" fill="#2d4a3e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="415" y="150" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="600">GPU Die #1</text>
  <text x="415" y="168" text-anchor="middle" fill="#a0a5ad" font-size="8">~1,000 mm²</text>

  <rect x="480" y="120" width="90" height="70" rx="4" fill="#2d4a3e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="525" y="150" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="600">GPU Die #2</text>
  <text x="525" y="168" text-anchor="middle" fill="#a0a5ad" font-size="8">~1,000 mm²</text>

  <!-- HBM -->
  <rect x="585" y="120" width="40" height="70" rx="3" fill="#4a2d3e" stroke="#d29922" stroke-width="1.5"/>
  <text x="605" y="155" text-anchor="middle" fill="#d29922" font-size="7">HBM</text>

  <!-- Advantage label -->
  <rect x="360" y="340" width="240" height="25" rx="3" fill="#1f3d1f" stroke="#3fb950" stroke-width="1"/>
  <text x="480" y="357" text-anchor="middle" fill="#3fb950" font-size="8">✓ Local Si only → less warpage, higher yield</text>

  <!-- Arrow between -->
  <line x1="310" y1="180" x2="340" y2="180" stroke="#4a8fe0" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="325" y="170" text-anchor="middle" fill="#4a8fe0" font-size="8">evolve</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#4a8fe0" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>