                  - generic "More" [ref=e662] [cursor=pointer]
                - generic [ref=e663]:
                  - heading "About" [level=2] [ref=e664]
                  - 'link "Permalink: About" [ref=e665] [cursor=pointer]':
                    - /url: "#about"
                - paragraph [ref=e668]: "SGLang is a high-performance serving framework for large language models and multimodal models. It is designed to deliver low-latency and high-throughput inference across a wide range of setups, from a single GPU to large distributed clusters. Its core features include:"
                - list [ref=e669]:
                  - listitem [ref=e670]:
                    - strong [ref=e671]: Fast Runtime
                    - text: ": Provides efficient serving with RadixAttention for prefix caching, a zero-overhead CPU scheduler, prefill-decode disaggregation, speculative decoding, continuous batching, paged attention, tensor/pipeline/expert/data parallelism, structured outputs, chunked prefill, quantization (FP4/FP8/INT4/AWQ/GPTQ), and multi-LoRA batching."
                  - listitem [ref=e672]:
                    - strong [ref=e673]: Broad Model Support
                    - text: ": Supports a wide range of language models (Llama, Qwen, DeepSeek, Kimi, GLM, GPT, Gemma, Mistral, etc.), embedding models (e5-mistral, gte, mcdse), reward models (Skywork), and diffusion models (WAN, Qwen-Image), with easy extensibility for adding new models. Compatible with most Hugging Face models and OpenAI APIs."
                  - listitem [ref=e674]:
                    - strong [ref=e675]: Extensive Hardware Support
                    - text: ": Runs on NVIDIA GPUs (GB200/B300/H100/A100/Spark/5090), AMD GPUs (MI355/MI300), Intel Xeon CPUs, Google TPUs, Ascend NPUs, and more."
                  - listitem [ref=e676]:
                    - strong [ref=e677]: Active Community
                    - text: ": SGLang is open-source and supported by a vibrant community with widespread industry adoption, powering over 400,000 GPUs worldwide."
                  - listitem [ref=e678]:
                    - strong [ref=e679]: RL & Post-Training Backbone
                    - text: ": SGLang is a proven rollout backend used for training many frontier models, with native RL integrations and adoption by well-known post-training frameworks such as"
