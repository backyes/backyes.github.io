      - heading "Tips" [level=2] [ref=f51e72]
      - paragraph [ref=f51e73]: "Wildcards:"
      - list [ref=f51e74]:
        - listitem [ref=f51e75]: Use ? to replace a single character or * to replace any number of characters.
        - listitem [ref=f51e76]: Can be used in any field, but not in the first character position. See Journal References tips for exceptions.
      - paragraph [ref=f51e77]: "Expressions:"
      - list [ref=f51e78]:
        - listitem [ref=f51e79]: TeX expressions can be searched, enclosed in single $ characters.
      - paragraph [ref=f51e80]: "Phrases:"
      - list [ref=f51e81]:
        - listitem [ref=f51e82]: Enclose phrases in double quotes for exact matches in title, abstract, and comments.
      - paragraph [ref=f51e83]: "Dates:"
      - list [ref=f51e84]:
        - listitem [ref=f51e85]:
          - text: Sorting by announcement date will use the year and month the
          - emphasis [ref=f51e86]: original version
          - text: (v1) of the paper was announced.
        - listitem [ref=f51e87]:
          - text: Sorting by submission date will use the year, month and day the
          - emphasis [ref=f51e88]: latest version
          - text: of the paper was submitted.
      - paragraph [ref=f51e89]: "Journal References:"
      - list [ref=f51e90]:
        - listitem [ref=f51e91]:
          - text: If a journal reference search contains a wildcard, matches will be made using wildcard matching as expected. For example,
          - strong [ref=f51e92]: math*
          - text: will match
          - emphasis [ref=f51e93]: math
          - text: ","
          - emphasis [ref=f51e94]: maths
          - text: ","
          - emphasis [ref=f51e95]: mathematics
          - text: .
        - listitem [ref=f51e96]:
          - text: If a journal reference search does
          - strong [ref=f51e97]: not
          - text: contain a wildcard, only exact phrases entered will be matched. For example,
          - strong [ref=f51e98]: math
          - text: would match
          - emphasis [ref=f51e99]: math
          - text: or
          - emphasis [ref=f51e100]: math and science
          - text: but not
          - emphasis [ref=f51e101]: maths
          - text: or
          - emphasis [ref=f51e102]: mathematics
          - text: .
        - listitem [ref=f51e103]:
          - text: "All journal reference searches that do not contain a wildcard are literal searches: a search for"
          - strong [ref=f51e104]: Physica A
          - text: will match all papers with journal references containing
          - emphasis [ref=f51e105]: Physica A
          - text: ", but a search for"
          - strong [ref=f51e106]: Physica A, 245 (1997) 181
          - text: will only return the paper with journal reference
          - emphasis [ref=f51e107]: Physica A, 245 (1997) 181
