      - article [ref=f14e47]:
        - heading "Searching by Author Name" [level=4] [ref=f14e49]
        - list [ref=f14e51]:
          - listitem [ref=f14e52]:
            - text: Using the
            - strong [ref=f14e53]: Author(s) field
            - text: produces best results for author name searches.
          - listitem [ref=f14e54]:
            - text: For the most precise name search, follow
            - strong [ref=f14e55]: surname(s), forename(s)
            - text: or
            - strong [ref=f14e56]: surname(s), initial(s)
            - text: "pattern: example Hawking, S or Hawking, Stephen"
          - listitem [ref=f14e57]:
            - text: For best results on multiple author names,
            - strong [ref=f14e58]: separate individuals with a ;
            - text: "(semicolon). Example: Jin, D S; Ye, J"
          - listitem [ref=f14e59]:
            - text: Author names enclosed in quotes will return only
            - strong [ref=f14e60]: exact matches
            - text: . For example, "Stephen Hawking" will not return matches for Stephen W. Hawking.
          - listitem [ref=f14e61]: Diacritic character variants are automatically searched in the Author(s) field.
          - listitem [ref=f14e62]: Queries with no punctuation will treat each term independently.
      - article [ref=f14e63]:
