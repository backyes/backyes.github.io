      - heading "Tips" [level=2] [ref=f14e72]
      - paragraph [ref=f14e73]: "Wildcards:"
      - list [ref=f14e74]:
        - listitem [ref=f14e75]: Use ? to replace a single character or * to replace any number of characters.
        - listitem [ref=f14e76]: Can be used in any field, but not in the first character position. See Journal References tips for exceptions.
      - paragraph [ref=f14e77]: "Expressions:"
      - list [ref=f14e78]:
        - listitem [ref=f14e79]: TeX expressions can be searched, enclosed in single $ characters.
      - paragraph [ref=f14e80]: "Phrases:"
      - list [ref=f14e81]:
        - listitem [ref=f14e82]: Enclose phrases in double quotes for exact matches in title, abstract, and comments.
      - paragraph [ref=f14e83]: "Dates:"
      - list [ref=f14e84]:
        - listitem [ref=f14e85]:
          - text: Sorting by announcement date will use the year and month the
          - emphasis [ref=f14e86]: original version
          - text: (v1) of the paper was announced.
        - listitem [ref=f14e87]:
          - text: Sorting by submission date will use the year, month and day the
          - emphasis [ref=f14e88]: latest version
          - text: of the paper was submitted.
      - paragraph [ref=f14e89]: "Journal References:"
      - list [ref=f14e90]:
        - listitem [ref=f14e91]:
          - text: If a journal reference search contains a wildcard, matches will be made using wildcard matching as expected. For example,
          - strong [ref=f14e92]: math*
          - text: will match
          - emphasis [ref=f14e93]: math
          - text: ","
          - emphasis [ref=f14e94]: maths
          - text: ","
          - emphasis [ref=f14e95]: mathematics
          - text: .
        - listitem [ref=f14e96]:
          - text: If a journal reference search does
          - strong [ref=f14e97]: not
          - text: contain a wildcard, only exact phrases entered will be matched. For example,
          - strong [ref=f14e98]: math
          - text: would match
          - emphasis [ref=f14e99]: math
          - text: or
          - emphasis [ref=f14e100]: math and science
          - text: but not
          - emphasis [ref=f14e101]: maths
          - text: or
          - emphasis [ref=f14e102]: mathematics
          - text: .
        - listitem [ref=f14e103]:
          - text: "All journal reference searches that do not contain a wildcard are literal searches: a search for"
          - strong [ref=f14e104]: Physica A
          - text: will match all papers with journal references containing
          - emphasis [ref=f14e105]: Physica A
          - text: ", but a search for"
          - strong [ref=f14e106]: Physica A, 245 (1997) 181
          - text: will only return the paper with journal reference
          - emphasis [ref=f14e107]: Physica A, 245 (1997) 181
          - text: .
