      - heading "Tips" [level=2] [ref=f58e72]
      - paragraph [ref=f58e73]: "Wildcards:"
      - list [ref=f58e74]:
        - listitem [ref=f58e75]: Use ? to replace a single character or * to replace any number of characters.
        - listitem [ref=f58e76]: Can be used in any field, but not in the first character position. See Journal References tips for exceptions.
      - paragraph [ref=f58e77]: "Expressions:"
      - list [ref=f58e78]:
        - listitem [ref=f58e79]: TeX expressions can be searched, enclosed in single $ characters.
      - paragraph [ref=f58e80]: "Phrases:"
      - list [ref=f58e81]:
        - listitem [ref=f58e82]: Enclose phrases in double quotes for exact matches in title, abstract, and comments.
      - paragraph [ref=f58e83]: "Dates:"
      - list [ref=f58e84]:
        - listitem [ref=f58e85]:
          - text: Sorting by announcement date will use the year and month the
          - emphasis [ref=f58e86]: original version
          - text: (v1) of the paper was announced.
        - listitem [ref=f58e87]:
          - text: Sorting by submission date will use the year, month and day the
          - emphasis [ref=f58e88]: latest version
          - text: of the paper was submitted.
      - paragraph [ref=f58e89]: "Journal References:"
      - list [ref=f58e90]:
        - listitem [ref=f58e91]:
          - text: If a journal reference search contains a wildcard, matches will be made using wildcard matching as expected. For example,
          - strong [ref=f58e92]: math*
          - text: will match
          - emphasis [ref=f58e93]: math
          - text: ","
          - emphasis [ref=f58e94]: maths
          - text: ","
          - emphasis [ref=f58e95]: mathematics
          - text: .
        - listitem [ref=f58e96]:
          - text: If a journal reference search does
          - strong [ref=f58e97]: not
          - text: contain a wildcard, only exact phrases entered will be matched. For example,
          - strong [ref=f58e98]: math
          - text: would match
          - emphasis [ref=f58e99]: math
          - text: or
          - emphasis [ref=f58e100]: math and science
          - text: but not
          - emphasis [ref=f58e101]: maths
          - text: or
          - emphasis [ref=f58e102]: mathematics
          - text: .
        - listitem [ref=f58e103]:
          - text: "All journal reference searches that do not contain a wildcard are literal searches: a search for"
          - strong [ref=f58e104]: Physica A
          - text: will match all papers with journal references containing
          - emphasis [ref=f58e105]: Physica A
          - text: ", but a search for"
