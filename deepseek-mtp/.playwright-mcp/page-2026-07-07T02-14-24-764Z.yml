        - generic [ref=f21e164]:
          - article [ref=f21e165]:
            - heading "Searching by Author Name" [level=4] [ref=f21e167]
            - list [ref=f21e169]:
              - listitem [ref=f21e170]:
                - text: Using the
                - strong [ref=f21e171]: Author(s) field
                - text: produces best results for author name searches.
              - listitem [ref=f21e172]:
                - text: For the most precise name search, follow
                - strong [ref=f21e173]: surname(s), forename(s)
                - text: or
                - strong [ref=f21e174]: surname(s), initial(s)
                - text: "pattern: example Hawking, S or Hawking, Stephen"
              - listitem [ref=f21e175]:
                - text: For best results on multiple author names,
                - strong [ref=f21e176]: separate individuals with a ;
                - text: "(semicolon). Example: Jin, D S; Ye, J"
              - listitem [ref=f21e177]:
                - text: Author names enclosed in quotes will return only
                - strong [ref=f21e178]: exact matches
                - text: . For example, "Stephen Hawking" will not return matches for Stephen W. Hawking.
              - listitem [ref=f21e179]: Diacritic character variants are automatically searched in the Author(s) field.
              - listitem [ref=f21e180]: Queries with no punctuation will treat each term independently.
          - article [ref=f21e181]:
            - heading "Searching by subcategory" [level=4] [ref=f21e183]
            - list [ref=f21e185]:
              - listitem [ref=f21e186]:
                - text: To search within a subcategory select
                - strong [ref=f21e187]: All fields
                - text: .
              - listitem [ref=f21e188]:
                - text: A subcategory search can be combined with an author or keyword search by clicking on
                - strong [ref=f21e189]: add another term
                - text: in advanced search.
          - heading "Tips" [level=2] [ref=f21e190]
          - paragraph [ref=f21e191]: "Wildcards:"
          - list [ref=f21e192]:
            - listitem [ref=f21e193]: Use ? to replace a single character or * to replace any number of characters.
            - listitem [ref=f21e194]: Can be used in any field, but not in the first character position. See Journal References tips for exceptions.
          - paragraph [ref=f21e195]: "Expressions:"
          - list [ref=f21e196]:
            - listitem [ref=f21e197]: TeX expressions can be searched, enclosed in single $ characters.
          - paragraph [ref=f21e198]: "Phrases:"
          - list [ref=f21e199]:
            - listitem [ref=f21e200]: Enclose phrases in double quotes for exact matches in title, abstract, and comments.
          - paragraph [ref=f21e201]: "Dates:"
          - list [ref=f21e202]:
            - listitem [ref=f21e203]:
              - text: Sorting by announcement date will use the year and month the
              - emphasis [ref=f21e204]: original version
              - text: (v1) of the paper was announced.
            - listitem [ref=f21e205]:
              - text: Sorting by submission date will use the year, month and day the
              - emphasis [ref=f21e206]: latest version
              - text: of the paper was submitted.
          - paragraph [ref=f21e207]: "Journal References:"
          - list [ref=f21e208]:
            - listitem [ref=f21e209]:
              - text: If a journal reference search contains a wildcard, matches will be made using wildcard matching as expected. For example,
              - strong [ref=f21e210]: math*
              - text: will match
              - emphasis [ref=f21e211]: math
              - text: ","
              - emphasis [ref=f21e212]: maths
              - text: ","
              - emphasis [ref=f21e213]: mathematics
              - text: .
            - listitem [ref=f21e214]:
              - text: If a journal reference search does
              - strong [ref=f21e215]: not
              - text: contain a wildcard, only exact phrases entered will be matched. For example,
              - strong [ref=f21e216]: math
              - text: would match
              - emphasis [ref=f21e217]: math
              - text: or
              - emphasis [ref=f21e218]: math and science
              - text: but not
              - emphasis [ref=f21e219]: maths
              - text: or
              - emphasis [ref=f21e220]: mathematics
              - text: .
            - listitem [ref=f21e221]:
              - text: "All journal reference searches that do not contain a wildcard are literal searches: a search for"
              - strong [ref=f21e222]: Physica A
              - text: will match all papers with journal references containing
              - emphasis [ref=f21e223]: Physica A
              - text: ", but a search for"
              - strong [ref=f21e224]: Physica A, 245 (1997) 181
              - text: will only return the paper with journal reference
              - emphasis [ref=f21e225]: Physica A, 245 (1997) 181
              - text: .
